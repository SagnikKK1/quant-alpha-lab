[project]
name = "alphalab"
version = "0.1.0"
description = "Cross-sectional ML alpha lab — point-in-time data layer with backtest-rigor harness"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.10,<2",
    "duckdb>=1.1,<2",
    "requests>=2.31",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphalab"]

[tool.pytest.ini_options]
markers = [
    "network: hits external services; excluded by default (run with -m network)",
]
addopts = "-m 'not network'"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.isort]
# Deterministic grouping regardless of how the environment resolves paths —
# local and CI must agree on what is first-party.
known-first-party = ["alphalab", "tests"]
